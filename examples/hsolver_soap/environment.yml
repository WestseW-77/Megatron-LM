# Reproducible base environment for the Hsolver SOAP experiments.
# Source packages with architecture-specific extensions are installed from
# their pinned Git checkouts as described in ENVIRONMENT.md.
name: hsolver-torch

channels:
  - nvidia/label/cuda-13.2.1
  - defaults

dependencies:
  - python=3.12.13
  - pip
  - cuda-toolkit=13.2.1
  - pip:
      - --extra-index-url=https://download.pytorch.org/whl/cu132
      - torch==2.12.1+cu132
      - absl-py==2.5.0
      - datasets==4.0.0
      - einops==0.8.2
      - huggingface-hub==0.36.2
      - ninja==1.13.0
      - numpy==2.5.1
      - nvdlfw-inspect==0.2.2
      - nvidia-cudnn-frontend==1.26.0
      - onnx==1.22.0
      - onnxscript==0.7.1
      - packaging==26.0
      - pandas==3.0.5
      - protobuf==7.36.1
      - pyarrow==25.0.1
      - pybind11==3.1.0
      - pydantic==2.13.4
      - pytest==9.1.1
      - pyyaml==6.0.3
      - sentencepiece==0.2.1
      - setuptools==81.0.0
      - tokenizers==0.21.4
      - transformers==4.55.4
      - wheel==0.47.0
